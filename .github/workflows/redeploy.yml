name: Hourly Koyeb Redeploy

on:
  schedule:
    # ┌─ 分钟 (0-59)
    # │ ┌─ 小时 (0-23)
    # │ │ ┌─ 日 (1-31)
    # │ │ │ ┌─ 月 (1-12)
    # │ │ │ │ ┌─ 星期 (0-6, 0=周日)
    # │ │ │ │ │
    - cron: '0 */1 * * *'   # 每 1 小时
  workflow_dispatch:         # 允许手动触发

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy Koyeb Service
        run: |
          curl -v -X POST \
            "https://app.koyeb.com/v1/services/${{ secrets.KOYEB_SERVICE_ID }}/redeploy" \
            -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
            -H "Content-Type: application/json"
