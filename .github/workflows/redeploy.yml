name: Koyeb Hourly Redeploy

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy Service
        env:
          KOYEB_TOKEN: *** secrets.KOYEB_API_TOKEN }}
        run: |
          wget -q -O koyeb.tar.gz "https://github.com/koyeb/koyeb-cli/releases/latest/download/koyeb-cli_linux_amd64.tar.gz"
          tar -xzf koyeb.tar.gz
          chmod +x koyeb
          ./koyeb login --token "$KOYEB_TOKEN"
          ./koyeb services redeploy mg-koyebb -a vulnerable-meredithe --use-cache --wait --wait-timeout 3m
